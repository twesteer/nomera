45\x22>У\x20тебя\x20150\x20тысяч,\x20старая\x20«девятка»\x20и\x20один\x20скучный\x20номер.\x20Задача\x20—\x20подняться\x20от\x20новичка\x20у\x20ГИБДД\x20до\x20империи\x20номеров.</p><div\x20class=\x22card\x20flat\x22\x20style=\x22font-size:14px;line-height:1.5;gap:8px\x22><p><b>Крути</b>\x20номера\x20в\x20ГИБДД:\x20крутка\x20стоит\x20денег\x20и\x20одного\x20талона.\x20Совпадения\x20цифр,\x20букв\x20и\x20козырный\x20регион\x20умножают\x20цену.\x20Один\x20и\x20тот\x20же\x20номер\x20дважды\x20не\x20выдают.</p><p><b>Замки</b>\x20оставляют\x20символ\x20на\x20следующей\x20крутке,\x20максимум\x20пять.\x20Если\x20крутить\x20с\x20замками\x20подряд,\x20инспектор\x20начинает\x20коситься,\x20и\x20каждый\x20следующий\x20раз\x20замки\x20дороже\x20в\x201,6\x20раза.</p><p><b>Продавай</b>\x20на\x20барахолке\x20(можно\x20торговаться),\x20на\x20аукционе\x20или\x20по\x20заказам\x20—\x20заказы\x20платят\x20больше\x20всего.\x20Если\x20продавать\x20много\x20похожих\x20номеров,\x20рынок\x20заваливается\x20и\x20цена\x20падает.</p><p><b>Блат.</b>\x20Инспектору\x20можно\x20сунуть,\x20чтобы\x20на\x20нужном\x20месте\x20выпал\x20нужный\x20символ.\x20Это\x20поднимает\x20внимание\x20ГИБДД.\x20Чем\x20оно\x20выше,\x20тем\x20чаще\x20рейды:\x20штраф\x20и\x20изъятие\x20номеров\x20«по\x20блату».</p><p><b>Джекпот</b>\x20—\x20три\x20одинаковые\x20цифры,\x20одинаковые\x20буквы\x20или\x20слово\x20и\x20козырный\x20регион\x20в\x20одном\x20номере.\x20Если\x20ещё\x20и\x20цифры\x20совпадают\x20с\x20регионом,\x20как\x20в\x20«О\x20777\x20ОО\x20777»,\x20цена\x20улетает\x20в\x20космос.</p><p><b>Машины</b>\x20с\x20номерами\x20приносят\x20аренду\x20каждую\x20ночь,\x20по\x20субботам\x20автошоу.\x20В\x20офисе\x20можно\x20нанять\x20работников.</p><p><b>Цель</b>\x20—\x20стать\x20«Королём\x20рынка»,\x20открыть\x20свою\x20площадку\x20и\x20довести\x20её\x20до\x20империи\x20номеров.</p></div>'+('off'!==_0x40b2fb[_0x59f3e9(0x306)]?_0x59f3e9(0x2ac):''),_0x5a113a='Начать';else{if('v2'===_0xeff87c['type'])_0x3a21aa=_0x59f3e9(0x27
